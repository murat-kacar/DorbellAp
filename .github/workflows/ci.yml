name: CI

on:
  push:
    branches: [master]
  pull_request:

# Every ESP-IDF job runs in the same pinned toolchain image
jobs:
  firmware:
    name: Build ${{ matrix.project }} (esp32, Production defaults)
    runs-on: ubuntu-26.04
    container: espressif/idf:v6.1.1
    strategy:
      fail-fast: false
      matrix:
        project: [firmware/panel, firmware/unit]
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C "${{ matrix.project }}" set-target esp32 build

  # Burn profile (ADR 0015) layered the way the flasher builds it: firmware/sdkconfig.defaults +
  # firmware/sdkconfig.burn in build_burn/. tools/check_burn_build.py then signs with a throw-away key through the
  # flasher's own signing code and verifies the resolved security options, the layout and the merged image's signatures.
  firmware-burn:
    name: Build ${{ matrix.project }} (esp32, Burn profile)
    runs-on: ubuntu-26.04
    container: espressif/idf:v6.1.1
    strategy:
      fail-fast: false
      matrix:
        project: [firmware/panel, firmware/unit]
    steps:
      - uses: actions/checkout@v7
      - name: Build with the Burn overlay
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd "${{ matrix.project }}"
          idf.py -B build_burn -D SDKCONFIG="$PWD/build_burn/sdkconfig" \
                 -D SDKCONFIG_DEFAULTS="$PWD/../sdkconfig.defaults;$PWD/../sdkconfig.burn" set-target esp32 build
      - name: Sign, merge and verify like the flasher
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/check_burn_build.py "${{ matrix.project }}"

  host-unit:
    name: Host unit tests (linux target)
    runs-on: ubuntu-26.04
    container: espressif/idf:v6.1.1
    steps:
      - uses: actions/checkout@v7
      - name: Build and run test/host_unit
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd test/host_unit
          idf.py --preview set-target linux
          idf.py build
          ./build/doorbell_host_unit.elf

  python:
    name: Protocol vectors and Python lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install cryptography ruff==0.17.5
      - run: python tools/verify_protocol_vectors.py
      - run: ruff check flasher tools
      - run: ruff format --check flasher tools

  # C formatting with the ESP-IDF astyle rules (.pre-commit-config.yaml, tools/astyle-rules.yml)
  c-style:
    name: C formatting (astyle)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pre-commit
      - run: pre-commit run astyle_py --all-files --show-diff-on-failure
